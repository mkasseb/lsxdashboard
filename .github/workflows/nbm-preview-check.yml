name: NBM draft preview verification

# Review-only browser verification. No publication job, credentials or production writes.
on:
  pull_request:
    branches: [main, codex/nbm-inline-forecast, codex/nbm-hourly-range]

permissions:
  contents: read

jobs:
  preview:
    if: (github.head_ref == 'codex/nbm-inline-forecast' || github.head_ref == 'codex/nbm-hourly-range' || github.head_ref == 'codex/nbm-bottom-line') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install existing browser verification tools
        run: |
          npm install --prefix "$RUNNER_TEMP/nbm-browser" playwright@1.62.1
          node "$RUNNER_TEMP/nbm-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test exact hosted preview with normal TLS
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: NODE_PATH="$RUNNER_TEMP/nbm-browser/node_modules" node tools/nbm-preview-tests.js "$RUNNER_TEMP/nbm-preview"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbm-hosted-preview-verification
          path: ${{ runner.temp }}/nbm-preview
          retention-days: 7
          if-no-files-found: warn
