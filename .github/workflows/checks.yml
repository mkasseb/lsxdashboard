# A push to `main` deploys straight to Cloudflare Pages with no build step in between,
# so this is the only thing standing between an edit and production. See tools/check.py
# for what it checks and why.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python3 tools/check.py
      - run: node tools/logic-tests.js
      - run: node tools/seasonal-tests.js
      - run: node tools/nbm-tests.js
      - run: python3 tools/nbm-extract-tests.py
      - run: python3 tools/nbm-refresh-tests.py
      - run: python3 tools/nbm-publish-tests.py
      - run: node tools/nbm-hourly-tests.js
      - run: python3 -m pip install -r tools/nbm-requirements.txt
      - run: python3 tools/nbm-hourly-refresh-tests.py
      - run: python3 tools/nbm-hourly-publish-tests.py
      - run: python3 tools/nbm-combined-tests.py

  browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install browser test tools outside the static app
        run: |
          npm install --prefix "$RUNNER_TEMP/lsx-browser" playwright@1.62.1 pngjs@7.0.0 leaflet@1.9.4 maplibre-gl@5.24.0 @maplibre/maplibre-gl-leaflet@0.1.4
          node "$RUNNER_TEMP/lsx-browser/node_modules/playwright/cli.js" install --with-deps ${{ matrix.browser }}
      - name: Verify weather icon artwork in both themes
        env:
          WEATHER_BROWSER: ${{ matrix.browser }}
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          NODE_PATH="$RUNNER_TEMP/lsx-browser/node_modules" REDESIGN_ARTIFACTS="$RUNNER_TEMP/redesign" xvfb-run -a node tools/icon-theme-tests.js
      - name: Verify radar camera through location and layout changes
        env:
          WEATHER_BROWSER: ${{ matrix.browser }}
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          NODE_PATH="$RUNNER_TEMP/lsx-browser/node_modules" REDESIGN_ARTIFACTS="$RUNNER_TEMP/redesign" xvfb-run -a node tools/radar-camera-tests.js
      - name: Run production-page weather scenarios
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          WEATHER_BROWSER: ${{ matrix.browser }}
          WEATHER_CASE_FILTER: ${{ matrix.browser == 'chromium' && '.*' || 'bootstrap|print-only|fullscreen|individual context|risk explanations|hourly refresh preserves|missing hour' }}
        run: |
          NODE_PATH="$RUNNER_TEMP/lsx-browser/node_modules" WEATHER_STRESS_REPORT="$RUNNER_TEMP/weather-scenarios.json" xvfb-run -a node tools/weather-stress-tests.js
      - name: Verify upgrade with real browser HTTP cache
        env:
          WEATHER_BROWSER: ${{ matrix.browser }}
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          NODE_PATH="$RUNNER_TEMP/lsx-browser/node_modules" xvfb-run -a node tools/cache-upgrade-tests.js
      - name: Verify official source destinations and keyboard/touch links
        env:
          WEATHER_BROWSER: ${{ matrix.browser }}
        run: |
          NODE_PATH="$RUNNER_TEMP/lsx-browser/node_modules" xvfb-run -a node tools/source-link-tests.js
      - name: Verify redesign layout and controls
        env:
          WEATHER_BROWSER: ${{ matrix.browser }}
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          NODE_PATH="$RUNNER_TEMP/lsx-browser/node_modules" REDESIGN_ARTIFACTS="$RUNNER_TEMP/redesign" xvfb-run -a node tools/redesign-tests.js
      - name: Verify optional NBM range prototype
        if: matrix.browser == 'chromium'
        run: |
          NODE_PATH="$RUNNER_TEMP/lsx-browser/node_modules" NBM_ARTIFACTS="$RUNNER_TEMP/redesign/nbm" node tools/nbm-browser-tests.js
      - name: Verify hourly NBM band and isolation
        if: matrix.browser == 'chromium'
        run: NODE_PATH="$RUNNER_TEMP/lsx-browser/node_modules" NBM_ARTIFACTS="$RUNNER_TEMP/redesign/nbm-hourly" node tools/nbm-hourly-browser-tests.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-scenarios-${{ matrix.browser }}
          path: |
            ${{ runner.temp }}/weather-scenarios.json
            ${{ runner.temp }}/redesign
          if-no-files-found: ignore
