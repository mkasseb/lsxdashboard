# A push to `main` deploys straight to Cloudflare Pages with no build step in between,
# so this is the only thing standing between an edit and production. See tools/check.py
# for what it checks and why.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python3 tools/check.py
      - run: node tools/logic-tests.js

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install browser test tools outside the static app
        run: |
          npm install --prefix "$RUNNER_TEMP/lsx-browser" playwright@1.62.1
          node "$RUNNER_TEMP/lsx-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Run production-page weather scenarios
        run: |
          NODE_PATH="$RUNNER_TEMP/lsx-browser/node_modules" WEATHER_STRESS_REPORT="$RUNNER_TEMP/weather-scenarios.json" node tools/weather-stress-tests.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-scenarios
          path: ${{ runner.temp }}/weather-scenarios.json
          if-no-files-found: ignore
