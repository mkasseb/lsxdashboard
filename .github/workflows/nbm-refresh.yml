name: NBM combined refresh

# Prepared recurring wiring. Activation requires an explicit reviewed repository variable.
# One budgeted commit combines changed daily/hourly pairs; neither draft enables it.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: nbm-data-publication
  cancel-in-progress: false

jobs:
  extract:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && vars.NBM_REFRESH_ENABLED == 'true') }}
    outputs:
      publishable: ${{ steps.refresh.outputs.publishable }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Load last committed products and publication budget
        id: seed
        run: |
          # On a draft, rehearse against its reviewed snapshots. Main always reads fresh main.
          SEED_HEAD=HEAD
          if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            git fetch --no-tags origin refs/heads/main
            SEED_HEAD=FETCH_HEAD
          fi
          python tools/nbm-combined-publish.py --seed --expected-head "$SEED_HEAD" --directory "$RUNNER_TEMP/nbm-data"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install decoder
        if: ${{ steps.seed.outputs.eligible == 'true' }}
        run: python -m pip install -r tools/nbm-requirements.txt
      - name: Refresh independent products within the publication budget
        id: refresh
        run: python tools/nbm-combined-refresh.py --output-dir "$RUNNER_TEMP/nbm-data"
      - name: Report extraction and resource use
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/nbm-data/nbm-combined-status.json" ]; then
            python -m json.tool "$RUNNER_TEMP/nbm-data/nbm-combined-status.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Extraction did not produce a status file; inspect the failed step.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbm-combined-refresh
          path: ${{ runner.temp }}/nbm-data
          retention-days: 3
          if-no-files-found: error

  publish:
    # Only normal writes to main; existing branch and Actions policies remain authoritative.
    if: ${{ github.ref == 'refs/heads/main' && vars.NBM_REFRESH_ENABLED == 'true' && needs.extract.outputs.publishable == 'true' }}
    needs: extract
    outputs:
      verifiable: ${{ steps.publish.outputs.verifiable }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: nbm-combined-refresh
          path: ${{ runner.temp }}/nbm-candidate
      - name: Validate and publish only changed forecast data
        id: publish
        run: |
          python tools/nbm-combined-publish.py --directory "$RUNNER_TEMP/nbm-candidate" --expected-head "$GITHUB_SHA" > "$RUNNER_TEMP/nbm-publication.json"
      - name: Report publication result
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/nbm-publication.json" ]; then
            cat "$RUNNER_TEMP/nbm-publication.json" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbm-publication-audit
          path: ${{ runner.temp }}/nbm-publication.json
          retention-days: 3
          if-no-files-found: warn

  verify:
    # Real-site browser checks run on manual rollout checks, not every hourly poll.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.NBM_REFRESH_ENABLED == 'true' && needs.publish.outputs.verifiable == 'true' }}
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: nbm-combined-refresh
          path: ${{ runner.temp }}/nbm-live
      - name: Install browser verification tools
        run: |
          npm install --prefix "$RUNNER_TEMP/nbm-browser" playwright@1.62.1
          node "$RUNNER_TEMP/nbm-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify public data and card under normal TLS
        run: NODE_PATH="$RUNNER_TEMP/nbm-browser/node_modules" node tools/nbm-live-tests.js "$RUNNER_TEMP/nbm-live"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbm-live-verification
          path: ${{ runner.temp }}/nbm-live/live-nbm-*.png
          retention-days: 3
          if-no-files-found: warn
