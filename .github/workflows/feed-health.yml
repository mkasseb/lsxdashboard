name: Live feed health
on:
  workflow_dispatch:
  schedule:
    - cron: '43 */6 * * *'
permissions:
  contents: read
concurrency:
  group: live-feed-health
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check keyless upstream data without changing dashboard feeds
        run: node tools/feed-health.js "$RUNNER_TEMP/feed-health.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-feed-health
          path: ${{ runner.temp }}/feed-health.json
          retention-days: 7
