<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0e14">
<link rel="icon" href="icon-192.png">
<title>Page not found — LSX Weather</title>

<!-- Cloudflare Pages serves this file, with a real 404 status, for any path that doesn't match a
     file in the repo. That status is the point of the page. Before it existed, Pages fell back to
     index.html at 200, which meant /robots.txt was 378 KB of dashboard and any URL a crawler
     invented became another indexable, byte-identical copy of the homepage.

     So the page has one job and must not be able to fail at it: no script, no third-party request,
     nothing that has to load before it can say what happened. It repeats the handful of colour
     tokens it needs from index.html rather than sharing a stylesheet, because a shared stylesheet
     is one more file that has to be found for the not-found page to work.

     The theme follows the OS setting only — index.html resolves an explicitly chosen theme out of
     localStorage, and that needs script. Someone who forced light against a dark OS gets dark here
     for the few seconds they spend on the page; that is the whole cost of having no script. -->
<style>
  :root{
    color-scheme:dark light;
    --bg:#0a0e14;--text:#e6edf5;--muted:#a7b4c6;--accent:#6bb4ff;--glow:rgba(74,163,255,.08);
  }
  @media (prefers-color-scheme:light){
    :root{--bg:#e4e9f2;--text:#101725;--muted:#4f5a6e;--accent:#1153b4;--glow:rgba(30,99,201,.10)}
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 80% -10%, var(--glow), transparent),var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:calc(24px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-right, 0px))
            calc(24px + env(safe-area-inset-bottom, 0px)) calc(24px + env(safe-area-inset-left, 0px));
  }
  main{max-width:34rem}
  .code{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin:0}
  h1{font-size:clamp(28px,5vw,40px);line-height:1.15;font-weight:700;margin:8px 0 0}
  p.body{font-size:15px;line-height:1.6;color:var(--muted);margin:14px 0 0}
  p.go{margin:22px 0 0;font-size:15px}
  a{color:var(--accent);text-decoration:none;font-weight:700}
  a:hover{text-decoration:underline}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
</style>
</head>
<body>
<main>
  <p class="code">404 · page not found</p>
  <h1>There's nothing at this address.</h1>
  <p class="body">LSX Weather is a single page — radar, watches and warnings, forecasts, river
    gauges and climate all live on the dashboard itself. Whatever you were after is either there
    or was never here.</p>
  <p class="go"><a href="/">Go to the dashboard</a></p>
</main>
</body>
</html>
